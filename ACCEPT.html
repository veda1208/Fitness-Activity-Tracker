
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fitness Activity Tracker - BeFit</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background: linear-gradient(135deg, #11998e, #38ef7d);
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 35px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #11998e;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #11998e;
            box-shadow: 0 0 5px rgba(17, 153, 142, 0.3);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: none;
            border-radius: 7px;
            background: #11998e;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #087f75;
            transform: translateY(-2px);
        }

        .signin {
            margin-top: 20px;
            text-align: center;
            color: #555;
            font-size: 14px;
        }

        .signin a {
            color: #11998e;
            font-weight: bold;
            text-decoration: none;
        }

        .signin a:hover {
            text-decoration: underline;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>BeFit</h1>
        <p class="subtitle">Your Fitness Journey Starts Here!</p>

        <form id="registrationForm" action="login.html" method="post">

            <div class="form-group">
                <label for="firstName">First Name:</label>
                <input type="text" id="firstName"
                       name="firstName" placeholder="Enter first name"
                       required>
            </div>

            <div class="form-group">
                <label for="lastName">Last Name:</label>
                <input type="text" id="lastName"
                       name="lastName" placeholder="Enter last name"
                       required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone"
                       name="phone" placeholder="Enter phone number"
                       pattern="[0-9]{10}"
                       title="Enter a 10-digit phone number"
                       required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email"
                       name="email" placeholder="Enter email address"
                       required>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password"
                       name="password" placeholder="Create password"
                       minlength="8" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword"
                       name="confirmPassword"
                       placeholder="Confirm password" required>
            </div>

            <button type="submit">Create Account</button>

            <p id="message"></p>

            <div class="signin">
                Already have an account?
                <a href="sign-in.html">Sign in</a>
            </div>

        </form>

    </div>

    <script>
        const form = document.getElementById("registrationForm");

        form.addEventListener("submit", function(event) {
            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                event.preventDefault();

                document.getElementById("message").textContent =
                    "Passwords do not match!";

                document.getElementById("message").style.color = "red";
            }
        });
    </script>

</body>
</html>
